<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PropertyOS</title>
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body>
<div class="shell">
<aside id="workspace-sidebar">
  <a class="brand" href="#overview"><span>PO</span> PropertyOS</a>
  <nav aria-label="Workspace" id="navigation"></nav>
  <p class="workspace">LOCAL WORKSPACE <small>Property management demo</small></p>
</aside>
<main>
<header class="top"><div class="top-start"><button class="secondary menu-toggle" type="button" aria-controls="workspace-sidebar" aria-expanded="false">Menu</button><span>Portfolio workspace</span></div><span class="avatar" aria-label="Portfolio manager">PM</span></header>
<div id="view"></div>
</main>
<button class="menu-backdrop" type="button" aria-label="Close menu" tabindex="-1"></button>
</div>
<dialog id="editor" aria-labelledby="editor-title">
<form id="record-form">
  <div class="dialog-header"><h2 id="editor-title"></h2><button class="close" type="button" aria-label="Close">×</button></div>
  <div id="fields"></div>
  <p id="form-error" role="alert"></p>
  <div class="actions"><button type="button" class="secondary close-cancel">Cancel</button><button type="submit">Save record</button></div>
</form>
</dialog>
<div id="status" role="status"></div>
</body>
</html>
